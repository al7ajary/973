<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مصمم القوالب</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1b1b22;--mut:#6b6b76;--gold:#8b744b;--navy:#22204f}
@media(prefers-color-scheme:dark){:root{--bg:#15151a;--card:#1f1f27;--ink:#f2f2f5;--mut:#a0a0ad}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:20px;margin:8px 0 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.chip{flex:1;min-width:90px;padding:12px;border-radius:10px;border:2px solid transparent;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.chip.on{border-color:var(--gold);background:var(--gold);color:#fff}
textarea,input[type=password]{width:100%;padding:12px;border-radius:10px;border:1px solid #8884;background:var(--bg);color:var(--ink);font:inherit}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.main:disabled{opacity:.5}.mut{color:var(--mut);font-size:14px}.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:64px;height:80px;object-fit:cover;border-radius:6px}
.res img{width:100%;border-radius:10px;margin-bottom:6px}.res a{display:block;text-align:center;padding:10px;border-radius:10px;background:var(--gold);color:#fff;text-decoration:none;margin-bottom:14px}
.diff{background:var(--bg);padding:10px;border-radius:10px;margin:8px 0}.hide{display:none}.err{color:#c0392b}
</style></head><body><main>
<h1>مصمم القوالب</h1>
<div id="login" class="card hide"><label>رمز الدخول</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"><p id="lerr" class="err"></p><button class="main" id="lbtn">دخول</button></div>
<div id="app" class="hide">
 <div class="card"><label>القالب</label><div class="row" id="tpls"></div></div>
 <div class="card"><label>الصور (الأولى = الغلاف)</label><input id="files" type="file" accept="image/*" multiple><div class="thumbs" id="th"></div><p class="mut">أكثر من صورة = كاروسيل: الأولى بالقالب والباقي يتغير مقاسه فقط.</p></div>
 <div class="card"><label>العنوان</label><textarea id="title" rows="3"></textarea>
  <p><label class="mut"><input type="checkbox" id="enh" checked> تحسين الألوان (خفيف)</label><label class="mut"><input type="checkbox" id="spell"> افحص الإملاء قبل التصميم</label></p></div>
 <div id="fix" class="card hide"><b>ملاحظات الإملاء</b><div class="diff" id="chg"></div><div class="diff" id="fixed"></div>
  <div class="row"><button class="chip" id="ok">✅ اعتمد التصحيح</button><button class="chip" id="mine">✏️ أعدّل بنفسي</button><button class="chip" id="keep">➡️ كلامي كما هو</button></div></div>
 <button class="main" id="go" disabled>صمم</button><p id="msg" class="mut"></p>
 <div class="res" id="res"></div>
</div></main>
<script>
const $=i=>document.getElementById(i);let tpl=null,imgs=[];
const api=async(p,b)=>{const r=await fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});if(r.status===401){show(0);throw new Error('login')}const j=await r.json();if(!r.ok)throw new Error(j.error||'خطأ');return j};
function show(app){$('login').classList.toggle('hide',!!app);$('app').classList.toggle('hide',!app)}
async function init(){try{const r=await fetch('/api/config',{method:'POST'});if(r.status===401)return show(0);const j=await r.json();show(1);$('tpls').innerHTML='';j.templates.forEach((t,i)=>{const b=document.createElement('button');b.className='chip'+(i?'':' on');b.textContent=t.name;b.onclick=()=>{tpl=t.key;[...$('tpls').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');chk()};$('tpls').append(b);if(!i)tpl=t.key});}catch{show(0)}}
$('lbtn').onclick=async()=>{try{await api('/api/login',{pin:$('pin').value});init()}catch(e){$('lerr').textContent=e.message}};
// تصغير الصور قبل الرفع (حد أقصى 2400px) لتسريع الرفع من الجوال
const shrink=f=>new Promise(ok=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,2400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.93))};i.src=u});
$('files').onchange=async e=>{imgs=[];$('th').innerHTML='';for(const f of e.target.files){const d=await shrink(f);imgs.push(d);const im=new Image();im.src=d;$('th').append(im)}chk()};
const chk=()=>$('go').disabled=!(tpl&&imgs.length&&$('title').value.trim());$('title').oninput=chk;
async function render(title){$('msg').textContent='جاري التصميم…';$('go').disabled=true;$('res').innerHTML='';
 try{const j=await api('/api/render',{template:tpl,title,enhance:$('enh').checked,images:imgs});
  j.images.forEach((d,i)=>{const im=new Image();im.src=d;const a=document.createElement('a');a.href=d;a.download='post-'+(i+1)+'.jpg';a.textContent='تنزيل '+(i+1);$('res').append(im,a)});
  $('msg').textContent=j.overflow?'⚠️ العنوان طويل جداً، ممكن ما يتسع بشكل مريح.':''}catch(e){$('msg').textContent=e.message}chk()}
$('go').onclick=async()=>{const t=$('title').value.trim();$('fix').classList.add('hide');
 if(!$('spell').checked)return render(t);
 $('msg').textContent='جاري فحص الإملاء…';$('go').disabled=true;
 try{const {result}=await api('/api/spell',{title:t});$('msg').textContent='';chk();if(!result)return render(t);
  $('chg').innerHTML=result.changes.map(c=>'• '+c.from+' ← '+c.to).join('<br>');$('fixed').textContent=result.corrected;$('fix').classList.remove('hide');
  $('ok').onclick=()=>{$('title').value=result.corrected;$('fix').classList.add('hide');render(result.corrected)};
  $('keep').onclick=()=>{$('fix').classList.add('hide');render(t)};
  $('mine').onclick=()=>{$('fix').classList.add('hide');$('title').focus();$('msg').textContent='عدّل النص ثم اضغط صمم (بدون فحص).';$('spell').checked=false}
 }catch(e){$('msg').textContent=e.message;chk()}};
init();
</script></body></html>
